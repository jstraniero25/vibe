<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2d5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Race for Dottie">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Race for Dottie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1' y='1' width='38' height='38' rx='7' fill='%23fff'/%3E%3Crect x='4' y='4' width='32' height='32' rx='5' fill='%230e3166'/%3E%3Cpath d='M4 27h32v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z' fill='%23c41e26'/%3E%3Cpath d='M12 9v11h16V9M20 20v11' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
<style>
/* Layout: a fixed-width late-2000s fantasy site. Navy masthead with tab nav; a white GAME CENTER
   panel (league/NFL score strip, red-vs-blue score header, projected/actual bar, position strip,
   dark live chart); then a folder-tabbed TRACK panel with both teams' box scores side by side. */
:root{
  --mast-hi:#1b4f94; --mast:#0d3168; --mast-lo:#061c40; --nav-hi:#2a62ab; --nav:#174789;
  --red:#b3131b; --red-hi:#9b1a20; --red-lo:#6e0b10; --blue:#1452a3; --blue-hi:#2a64b8; --blue-lo:#103f86;
  --ink:#1e1e1e; --ink-2:#3a3a3a; --gray:#6b6b6b; --line:#d2d2d2; --line-2:#e2e2e2;
  --page:#dfe2e6; --panel:#ffffff; --pos:#efefef; --inplay:#ffe25a; --link:#1b4a8c; --gold:#f5c400;
  --chart:#1b1b1b; --line-a:#e2332f; --line-b:#3d8bff; --flash:#fff3a0;
  --ext:"Michroma","Eurostile Extended","Arial Black",Arial,sans-serif;
  --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font:13px/1.35 var(--sans);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.wrap{width:100%;max-width:1000px;margin-inline:auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── masthead ── */
.mast-top{background:linear-gradient(180deg,var(--mast-hi) 0%,var(--mast) 48%,#082554 52%,var(--mast-lo) 100%);padding-top:env(safe-area-inset-top,0px)}
.mast-in{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;min-height:70px;padding-block:9px}
.logo{display:flex;align-items:center;gap:12px;color:#fff;min-width:0}
.logo svg{flex:0 0 auto;width:42px;height:42px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.logo-txt{font:400 23px/1 var(--ext);letter-spacing:.05em;text-transform:uppercase;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);white-space:nowrap}
.mypill{margin-left:auto;display:flex;align-items:center;gap:9px;height:38px;max-width:300px;padding:3px 14px 3px 3px;border:1px solid #3b66a6;border-radius:3px;background:linear-gradient(#123a74,#0a2752);color:#fff;font:bold 14px/1 var(--sans);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.mypill:hover{background:linear-gradient(#174587,#0c2d5f)}
.mypill .nm{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.find{position:relative;display:flex;align-items:center}
.mypill[hidden]+.find{margin-left:auto}
.find input{width:200px;height:24px;border:1px solid #071d3d;border-radius:2px 0 0 2px;padding:0 6px;background:#fff;color:#222;font:11px/1 var(--sans);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.find input::placeholder{color:#777}
.find>button{width:28px;height:24px;display:grid;place-items:center;border:1px solid #071d3d;border-left:0;border-radius:0 2px 2px 0;background:linear-gradient(#f6f6f6,#cdcdcd);color:#333}
.find-res{position:absolute;right:0;top:29px;z-index:30;width:320px;max-width:calc(100vw - 32px);background:#fff;border:1px solid #8d9bb0;border-radius:2px;box-shadow:0 5px 14px rgba(0,0,0,.32)}
.fr{display:block;width:100%;padding:7px 9px;border:0;border-top:1px solid #e4e4e4;background:#fff;text-align:left;font:12px/1.3 var(--sans);color:#222}
.fr:first-child{border-top:0}
.fr:hover,.fr:focus-visible{background:#eef3fb}
.fr b{color:var(--link)}
.fr small{display:block;margin-top:1px;color:#666;font-size:11px}
.fr-none{padding:9px;color:#555;font:12px/1.4 var(--sans)}

.mast-nav{background:linear-gradient(var(--nav-hi),var(--nav) 60%,#123d79);border-top:1px solid #4b7fc4;border-bottom:1px solid #0a2a57;box-shadow:0 2px 3px rgba(0,0,0,.18)}
.nav-in{display:flex;align-items:flex-end;gap:2px;min-height:31px;overflow-x:auto;scrollbar-width:none}
.season{padding-right:14px;color:#cfe0f7;font:bold 12px/31px var(--sans);white-space:nowrap}
.nv{flex:0 0 auto;height:26px;padding:0 16px;border:0;border-radius:3px 3px 0 0;background:none;color:#fff;font:bold 12px/26px var(--sans);white-space:nowrap}
.nv:hover{background:rgba(255,255,255,.13)}
.nv[aria-current="page"]{background:linear-gradient(#ffffff,#e6e6e6);color:var(--red)}
.nav-in .sp{flex:1}

/* ── page + panels ── */
.page{display:grid;gap:14px;padding-block:14px 26px}
.panel{background:var(--panel);border:1px solid #bcbcbc;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.16);overflow:hidden}
.gcp-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;padding:12px 14px 10px;background:linear-gradient(#ffffff,#e9e9e9);border-bottom:1px solid #cfcfcf}
.gcp-tt{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;min-width:0}
.gcp-title{margin:0;font:400 22px/1 var(--ext);letter-spacing:.03em;text-transform:uppercase;color:#1f1f1f}
.lgname{font:bold 11px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#7a7a7a}
.gcp-live{display:flex;align-items:center;gap:10px;font:bold 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:#555}
.livetag{display:inline-flex;align-items:center;gap:5px;color:#c41e26}
.livetag i{width:8px;height:8px;border-radius:50%;background:#e1251b;animation:pulse 1.3s ease-in-out infinite}
.sampletag{padding:3px 6px;border-radius:2px;background:var(--gold);color:#2b2200}
.rbtn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid #b2b2b2;border-radius:3px;background:linear-gradient(#fdfdfd,#dcdcdc);color:#333;font:bold 11px/1 var(--sans);letter-spacing:.03em;text-transform:uppercase}
.rbtn:hover:not(:disabled){background:linear-gradient(#ffffff,#e9e9e9)}
.rbtn:disabled{opacity:.45;cursor:default}
.rbtn.spin svg{animation:spin .8s linear infinite}

.selrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:10px 14px 8px}
.seg{display:flex;gap:4px}
.seg button{height:22px;padding:0 10px;border:0;border-radius:3px;background:none;color:var(--link);font:bold 11px/22px var(--sans);text-transform:uppercase}
.seg button:hover{background:#e7edf6}
.seg button[aria-pressed="true"]{background:linear-gradient(#2b5a9c,#0e3166);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.weeks{margin-left:auto;display:flex;align-items:center;gap:1px;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.weeks .lbl{margin-right:8px;font:bold 12px/22px var(--sans);text-transform:uppercase;white-space:nowrap;color:#222}
.weeks button{flex:0 0 auto;min-width:22px;height:22px;padding:0 3px;border:0;border-radius:2px;background:none;color:#333;font:bold 12px/22px var(--sans)}
.weeks button:hover:not([aria-current="true"]):not(:disabled){background:#e4e9f1;color:var(--link)}
.weeks button[aria-current="true"]{background:#0e3166;color:#fff}
.weeks button:disabled:not([aria-current="true"]){color:#bdbdbd;cursor:default}

.strip{display:flex;gap:3px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:thin}
.sb{flex:1 0 136px;min-width:136px;display:grid;align-content:start;gap:1px;padding:4px 7px 5px;border:1px solid #0f0f0f;border-radius:2px;background:linear-gradient(#525252,#303030 48%,#242424 52%,#1b1b1b);color:#b7b7b7;font:11px/1.45 var(--sans);text-align:left}
button.sb:hover{background:linear-gradient(#5f5f5f,#383838 48%,#2b2b2b 52%,#212121)}
.sb[aria-current="true"]{box-shadow:inset 0 3px 0 var(--gold)}
.sb .r{display:flex;justify-content:space-between;gap:6px;min-width:0}
.sb .r>span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sb .r.lead{color:#fff;font-weight:bold}
.sb .st{color:#e8c547;font-size:10px;font-weight:bold;letter-spacing:.03em;text-transform:uppercase}
.sb .st.live{color:#ff7468}
.strip-none{margin:0;padding:6px 0;color:#666;font-size:12px}
.ball{display:inline-block;width:10px;height:6px;margin-left:4px;border-radius:50%;background:#9a5a2a;vertical-align:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}

/* ── score header ── */
.mh{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);align-items:center;padding:10px 14px 14px}
.mh-msg{grid-column:1/-1;padding:18px 0;text-align:center;color:#666;font:bold 14px/1.3 var(--sans)}
.side{display:flex;align-items:center;gap:12px;min-width:0}
.side.b{flex-direction:row-reverse}
.mgr{flex:0 1 150px;min-width:0;color:#333;font:11px/1.45 var(--sans);text-align:right}
.side.b .mgr{text-align:left}
.mgr b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--link);font-size:12px}
.tav{position:relative;flex:0 0 auto;width:72px;height:48px;display:grid;place-items:center;overflow:hidden;border:1px solid #8c8c8c;background:linear-gradient(#ececec,#c3c3c3);color:#3a3a3a;font:bold 18px/1 var(--sans);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#ddd}
.tav.sm{width:46px;height:30px;font-size:12px;border-color:#2f5a97}
.tsc{flex:1 1 auto;min-width:0;display:grid;justify-items:center;gap:3px;text-align:center}
.tname{font:bold 20px/1.15 var(--sans);color:var(--red);overflow-wrap:anywhere}
.side.b .tname{color:var(--blue)}
.tpts{padding:0 4px;border-radius:3px;font:bold 48px/1 var(--sans);letter-spacing:-.02em;color:#111}
.vs{position:relative;align-self:stretch;display:grid;place-items:center;color:#8a8a8a;font:bold 11px/1 var(--sans)}
.vs::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid #d0d0d0}
.vs span{position:relative;padding:4px 0;background:var(--panel)}

/* ── projected bar, position strip, chart ── */
.vbar{display:flex;justify-content:space-between;align-items:center;min-height:24px;padding:0 8px;background:linear-gradient(#474747,#262626);border-top:1px solid #111}
.vbar button{padding:0 4px;border:0;background:none;color:#fff;font:bold 11px/24px var(--sans)}
.vbar button:hover{text-decoration:underline}
.pbar{display:grid;grid-template-columns:1fr 1fr;padding:3px 10px 8px;background:linear-gradient(#2a2a2a,#1e1e1e)}
.ph{position:relative;height:20px;background:linear-gradient(#8c8c8c,#686868)}
.ph.a{border-radius:10px 0 0 10px}
.ph.b{border-radius:0 10px 10px 0;border-left:1px solid #111}
.ph .pj{position:absolute;top:0;bottom:0;background:linear-gradient(#e8e8e8,#b2b2b2)}
.ph.a .pj{right:0;border-radius:10px 0 0 10px}
.ph.b .pj{left:0;border-radius:0 10px 10px 0}
.pjl{position:absolute;top:0;z-index:1;color:#2e2e2e;font:bold 11px/20px var(--sans);white-space:nowrap}
.ph.a .pjl{left:11px}
.ph.b .pjl{right:11px}
.ph .ac{position:absolute;top:0;bottom:0;z-index:2}
.ph.a .ac{right:0;background:linear-gradient(#e8423f,#a3121a)}
.ph.b .ac{left:0;background:linear-gradient(#4a8ff0,#174fa8)}
.acl{position:absolute;top:0;color:#fff;font:bold 11px/20px var(--sans);white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.ph.a .acl.outer{left:8px}
.ph.b .acl.outer{right:8px}
.ph.a .acl.inner{right:8px}
.ph.b .acl.inner{left:8px}
.ph.a .acl.out{right:calc(100% + 6px);color:#222;text-shadow:none}
.ph.b .acl.out{left:calc(100% + 6px);color:#222;text-shadow:none}
.txt-short,.op-in{display:none}

.chart{background:var(--chart);color:#d9d9d9;border-top:1px solid #000}
.ch-hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:9px 12px 3px;font:11px/1.2 var(--sans)}
.ch-t{color:#fff;font:italic bold 12px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase}
.ch-d{color:#cfcfcf}
.ch-days{display:flex;gap:2px}
.ch-days button{height:20px;padding:0 8px;border:1px solid #474747;border-radius:2px;background:#262626;color:#bdbdbd;font:bold 10px/18px var(--sans);text-transform:uppercase}
.ch-days button:hover{color:#fff}
.ch-days button[aria-pressed="true"]{background:#e9e9e9;border-color:#e9e9e9;color:#111}
.ch-y{margin-left:auto;color:#cfcfcf;font:bold 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.ch-svg{display:block;max-width:100%}
.ch-none{margin:0;padding:30px 12px;color:#bbb;text-align:center;font-size:12px}
.ch-leg{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:4px 16px;padding:3px 12px 8px;color:#bbb;font:11px/1.2 var(--sans)}
.ch-leg .k{display:inline-flex;align-items:center;gap:5px}
.ch-leg button{padding:0;border:0;background:none;color:#8fbaff;font:bold 11px/1 var(--sans);text-decoration:underline}
.ch-help{max-width:76ch;margin:0 12px 10px auto;padding:8px 10px;background:#262626;border:1px solid #3d3d3d;color:#d0d0d0;font:12px/1.5 var(--sans)}
.ch-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px 16px;padding:6px 12px;background:#0f0f0f;border-top:1px solid #000;color:#a9a9a9;font:11px/1.3 var(--sans)}
.ch-foot b{color:#fff}
.sq{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.sq.a{background:var(--line-a)}
.sq.b{background:var(--line-b)}

/* ── track panel ── */
.ftabs{display:flex;gap:4px;padding:9px 10px 0;background:linear-gradient(#f8f8f8,#e2e2e2);border-bottom:1px solid #9fb8d8;overflow-x:auto}
.ft{flex:0 0 auto;display:grid;justify-items:start;gap:2px;min-width:150px;padding:6px 14px;border:1px solid #9fb8d8;border-bottom:0;border-radius:5px 5px 0 0;background:linear-gradient(#e6f1fd,#bed7f2);color:var(--link);font:bold 15px/1 var(--sans);letter-spacing:.02em;text-align:left;text-transform:uppercase}
.ft small{color:#3e6396;font:11px/1.2 var(--sans);letter-spacing:0;text-transform:none}
.ft:hover{background:linear-gradient(#eef6fe,#cfe2f6)}
.ft[aria-selected="true"]{position:relative;top:1px;padding-bottom:7px;background:var(--panel)}
.subtabs{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;padding:10px 12px;border-bottom:1px solid #e2e2e2}
.subtabs button{padding:5px 9px;border:0;border-radius:3px;background:none;color:var(--link);font:bold 11px/1 var(--sans);letter-spacing:.02em;text-transform:uppercase}
.subtabs button:hover{background:#e7edf6}
.subtabs button[aria-pressed="true"]{background:linear-gradient(#2b5a9c,#0e3166);color:#fff}
.boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:12px}
.boxes.one{grid-template-columns:minmax(0,1fr)}
.tbox{min-width:0}
.tbox-hd{padding:5px 8px;border-radius:2px 2px 0 0;background:linear-gradient(var(--red-hi),var(--red-lo));color:#fff;font:bold 12px/1.25 var(--sans);overflow-wrap:anywhere}
.tbox-hd.b{background:linear-gradient(var(--blue-hi),var(--blue-lo))}
.sec{display:flex;align-items:baseline;gap:10px;margin:10px 0 4px;color:var(--ink-2);font:bold 17px/1 var(--sans);letter-spacing:-.01em;text-transform:uppercase}
.sec button{padding:0;border:0;background:none;color:var(--link);font:11px/1 var(--sans);letter-spacing:0;text-transform:none}
.sec button:hover{text-decoration:underline}
.tscroll{overflow-x:auto}
table.bx{width:100%;border-collapse:collapse;font:12px/1.3 var(--sans)}
.bx th{padding:4px 5px;border:1px solid #cdcdcd;background:linear-gradient(#f3f3f3,#dadada);color:#333;font:bold 11px/1.2 var(--sans);text-align:left;white-space:nowrap}
.bx th.grp{background:linear-gradient(#e9e9e9,#d0d0d0);text-align:center}
.bx th.pj,.bx th.ac{background:linear-gradient(#a2a2a2,#7b7b7b);color:#fff;text-align:center}
.bx th.n{text-align:right}
.bx td{padding:4px 5px;border:1px solid #dedede;vertical-align:middle}
.bx td.pos{width:44px;background:var(--pos);color:#555;font-size:11px;text-align:center;white-space:nowrap}
.bx tr.in td.pos{background:var(--inplay);color:#222}
.bx td.pl{color:var(--link)}
.bx td.pl.empty{color:#888;font-style:italic}
.bx td.op{width:44px;white-space:nowrap}
.bx td.stt{width:82px;white-space:nowrap}
.bx td.n{width:58px;text-align:right;white-space:nowrap}
.bx td.ac{font-weight:bold}
.bx td.dim,.bx .dim{color:#888}
.bx td.kd{color:#555;font-size:11px}
.bx tr.sep td{padding:5px;background:#f4f4f4;color:var(--ink-2);font:bold 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.bx tr.me td{background:#fffbe0}
.bx tr.bk-p td{background:#f4f6f9;font-weight:bold}
.bx tr.bk-l td{color:#444;font-size:11.5px}
.bx tr.bk-l td:first-child{border-right-color:transparent}
.bx.st td:first-child{width:36px;text-align:right}
.inj{margin-left:4px;color:#c41e26;font:bold 10px/1 var(--sans);vertical-align:1px}
.inj.tagx{color:#6b6b6b}
.rz{color:#c41e26;font:bold 10px/1 var(--sans)}
.dl{margin-right:5px;color:#1a7a33;font:bold 10px/1 var(--sans)}
.dl.down{color:#c41e26}
.tlink{padding:0;border:0;background:none;color:var(--link);font:bold 12px/1.3 var(--sans);text-align:left}
.tlink:hover{text-decoration:underline}
.totrow{display:flex;justify-content:flex-end;margin-top:3px}
.totrow>div{display:flex;align-items:center;gap:14px;padding:4px 10px;border-radius:0 0 2px 2px;background:linear-gradient(var(--red-hi),var(--red-lo));color:#fff;font:bold 12px/1 var(--sans)}
.totrow.b>div{background:linear-gradient(var(--blue-hi),var(--blue-lo))}
.totrow.bn>div{background:linear-gradient(#bcbcbc,#8f8f8f)}
.totrow .tp{color:rgba(255,255,255,.75);font-weight:normal}
.totrow .ta{padding:1px 3px;border-radius:2px;font-size:17px}
.trk-none{margin:0;padding:22px 14px;color:#666}

/* ── setup, notes, footer ── */
.setup .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;padding:0 6px 0 12px;background:linear-gradient(#2b5a9c,#0e3166);color:#fff;font:bold 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.setup .bar button{padding:6px 9px;border:0;border-radius:3px;background:none;color:#fff;font:bold 11px/1 var(--sans);text-transform:uppercase}
.setup .bar button:hover{background:rgba(255,255,255,.14)}
.setup-bd{display:grid;gap:11px;padding:14px}
.flbl{display:block;margin-bottom:5px;color:#333;font:bold 12px/1 var(--sans)}
.field{display:flex;flex-wrap:wrap;gap:8px}

.note{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:9px 12px;border:1px solid #e0cb63;border-radius:4px;background:#fff8c9;color:#3d3500;font:12.5px/1.45 var(--sans)}
.note.err{border-color:#e0a0a0;background:#fdeaea;color:#5a1010}
.note.info{border-color:#a9c3e8;background:#eaf2fd;color:#143664}
.note p{flex:1 1 300px;min-width:0;max-width:85ch;margin:0}

.foot-in button{padding:0;border:0;background:none;color:#d7e3f5;font:bold 11px/1.5 var(--sans);text-decoration:underline}

.bump,.bx tr.hit td{animation:yfade 2.6s ease-out}
@keyframes yfade{0%,20%{background-color:var(--flash)}100%{background-color:transparent}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

  .find{flex:1 1 100%;margin-left:0!important}

  .gcp-title{font-size:17px}

  .tname{font-size:15px}
  .tpts{font-size:34px}
  .pbar{padding:3px 8px 8px}
  .txt-long{display:none}
  .txt-short{display:inline}
  .season{display:none}
  .nv{padding:0 12px}
  .bx .op{display:none}
  .op-in{display:block;color:#777;font-size:10.5px}

  .bx td.n{width:48px}
  .bx td.stt{white-space:normal}
  .boxes{grid-template-columns:minmax(0,1fr);padding:10px 8px}

  .ch-foot{flex-direction:column;align-items:flex-start}
}

.m-weeks button[aria-current="true"]{border-color:#0a2752;background:linear-gradient(#2f62a8,#0e3166);color:#fff}

.ms-side{display:grid;justify-items:center;align-content:start;gap:3px;min-width:0;text-align:center}
.ms-side .tav{width:60px;height:40px;font-size:15px}
.ms-name{max-width:100%;color:var(--red);font:bold 15px/1.15 var(--sans);overflow-wrap:anywhere}
.ms-side.b .ms-name{color:var(--blue)}
.ms-pts{padding:0 3px;border-radius:3px;color:#111;font:bold 40px/1 var(--sans);letter-spacing:-.02em}

.ms-vs span{position:relative;padding:3px 0;background:#fff}
.ms-st{display:flex;justify-content:center;padding:0 10px 9px;color:#555;font:bold 11px/1.2 var(--sans);letter-spacing:.03em;text-transform:uppercase}

html.phone .pbar{padding:7px 8px 8px}
html.phone .pjl{display:none}

html.phone .bx .hs{display:none}

  const FIRST = ['Marcus', 'Tyler', 'Jalen', 'Devin', 'Caleb', 'Andre', 'Brandon', 'Isaiah', 'Trent', 'Malik', 'Darius', 'Elijah', 'Jordan', 'Xavier', 'Cole', 'Reggie', 'Terrell', 'Austin', 'Corey', 'Dante', 'Rashad', 'Quincy', 'Myles', 'Owen', 'Kendall', 'Wes', 'Gavin', 'Rodney', 'Shane', 'Leon'];
